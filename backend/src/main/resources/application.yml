server:
  port: 8080
  address: 0.0.0.0

spring:
  application:
    name: campus-trade
  
  datasource:
    url: jdbc:mysql://localhost:3306/campus_trade?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
  
  web:
    resources:
      static-locations: classpath:/resources/,classpath:/static/,classpath:/public/,classpath:/images/

logging:
  level:
    com.example.campustrade: DEBUG
    org.hibernate.SQL: DEBUG